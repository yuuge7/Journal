name: journal
description: "Offline-first journaling app for Android: rich-text entries, photos, moods, tags, streaks and password-encrypted backups."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.0.9
  cryptography: ^2.9.0
  drift: ^2.34.1
  drift_flutter: ^0.3.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_quill: ^11.0.0
  flutter_riverpod: ^3.3.2
  image_picker: ^1.2.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.6
  rxdart: ^0.28.0
  share_plus: ^12.0.2
  sqlite3_flutter_libs: ^0.6.0+eol
  table_calendar: ^3.2.0
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Bundled, not fetched. The app has no network path at all, so a runtime font
  # loader (google_fonts) would silently fall back to Roboto on first launch —
  # exactly the surface where the type is supposed to carry the identity.
  # Both families are OFL; the licences ship next to the files.
  fonts:
    - family: Schibsted Grotesk
      fonts:
        - asset: assets/fonts/SchibstedGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SchibstedGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SchibstedGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SchibstedGrotesk-Bold.ttf
          weight: 700
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
          weight: 400
        - asset: assets/fonts/Literata-Bold.ttf
          weight: 700
        - asset: assets/fonts/Literata-Italic.ttf
          weight: 400
          style: italic

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  # 0, not the plugin default of 16: the safe-zone padding is baked into the
  # source PNGs, and insetting again shrank the artwork to a quarter of the
  # icon — a speck in a flat field on any launcher that masks to a circle.
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icon/monochrome.png"
